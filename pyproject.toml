[project]
name = "aegis-discord-bot"
version = "1.0.0"
description = "A modular, restart-safe Discord community and moderation bot."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "discord.py>=2.6,<3",
  "aiosqlite>=0.20,<1",
  "aiohttp>=3.10,<4",
  "python-dotenv>=1.0,<2",
  "PyNaCl>=1.5,<2",
  "davey>=0.1.4,<1",
  "yt-dlp>=2025.1",
  "qrcode[pil]>=8.0,<9",
  "PyYAML>=6.0,<7",
]

[project.scripts]
aegis = "bot.__main__:main"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
